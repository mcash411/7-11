        @keyframes scan-laser {

        }
        .animate-laser {
            animation: scan-laser 2s infinite ease-in-out;
        }

            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-container { box-shadow: none !important; border: none !important; }

    <!-- JS 邏輯處理 -->
    <script>
        let currentType = 'goods';
        let currentBarcodeFormat = 'EAN8'; // 預設為 EAN-8
        let codeReader = null;
        let selectedDeviceId = null;

        // 預設 Goods 商品 JSON Payload
        let currentPayload = {
            "Goods": [
                {
                    "Commodity": [
                        {
                            "Device": "POS",
                            "Barcode": 20719128,
                            "Quantity": 1
                        }
                    ]
                }
            ]
        };

        window.onload = function() {
            syncFormFromPayload();
            renderBarcodes();
            registerPWA();
        };

        /* --- 相機與 ZXing 掃描引擎核心邏輯 --- */
        async function startScanner() {
            const modal = document.getElementById('scannerModal');
            const statusEl = document.getElementById('scannerStatus');
            modal.classList.remove('hidden');

            if (!window.isSecureContext) {
                statusEl.innerHTML = "<span class='text-rose-400 font-bold'>⚠️ 錯誤：相機需要 HTTPS 安全連線環境！</span>";
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.innerHTML = "<span class='text-rose-400 font-bold'>⚠️ 瀏覽器不支援相機存取功能</span>";
                return;
            }

            statusEl.innerText = "正在請求相機存取權限...";

            try {
                const initialStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                initialStream.getTracks().forEach(track => track.stop());

                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                const videoDevices = await codeReader.listVideoInputDevices();
                const selectEl = document.getElementById('cameraSelect');
                selectEl.innerHTML = '';

                if (videoDevices.length > 0) {
                    videoDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `鏡頭 ${index + 1}`;
                        selectEl.appendChild(option);
                    });

                    const backCamera = videoDevices.find(device => 
                        device.label.toLowerCase().includes('back') || 
                        device.label.toLowerCase().includes('rear') || 
                        device.label.toLowerCase().includes('environment') ||
                        device.label.includes('後')
                    );

                    selectedDeviceId = backCamera ? backCamera.deviceId : videoDevices[0].deviceId;
                    selectEl.value = selectedDeviceId;

                    decodeFromDevice(selectedDeviceId);
                } else {
                    statusEl.innerText = "未找到鏡頭設備";
                }
            } catch (err) {
                console.error("相機啟動錯誤:", err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    statusEl.innerHTML = "<span class='text-rose-400 font-bold'>🚫 權限被拒絕！請允許瀏覽器讀取相機</span>";
                } else {
                    statusEl.innerText = `鏡頭啟動失敗: ${err.message || '未知錯誤'}`;
                }
            }
        }

        function decodeFromDevice(deviceId) {
            const statusEl = document.getElementById('scannerStatus');
            statusEl.innerText = "請將 1D 條碼或 QR Code 置於框內";

            codeReader.decodeFromVideoDevice(deviceId, 'scannerVideo', (result, err) => {
                if (result) {
                    stopScanner();
                    handleScannedResult(result.getText());
                }
            });
        }

        function changeCamera(deviceId) {
            selectedDeviceId = deviceId;
            if (codeReader) {
                codeReader.reset();
            }
            decodeFromDevice(deviceId);
        }

        function stopScanner() {
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('scannerModal').classList.add('hidden');
        }

        function simulateScan() {
            stopScanner();
            const mockBarcode = '{"Goods":[{"Commodity":[{"Device":"POS","Barcode":20719128,"Quantity":1}]}]}';
            handleScannedResult(mockBarcode);
        }

        /* --- 掃描結果處理與資料帶入 --- */
        function handleScannedResult(scannedText) {
            const cleanText = scannedText.trim();

            try {
                const parsed = JSON.parse(cleanText);
                currentPayload = parsed;
                syncFormFromPayload();
            } catch (e) {
                if (currentType === 'goods') {
                    document.getElementById('inputBarcode').value = cleanText;
                    if (cleanText.length === 12 || cleanText.length === 13) {
                        setBarcodeFormat('EAN13');
                    } else if (cleanText.length === 7 || cleanText.length === 8) {
                        setBarcodeFormat('EAN8');
                    } else {
                        setBarcodeFormat('CODE128');
                    }
                } else if (currentType === 'egtc') {
                    document.getElementById('inputEgtcBarcode1').value = cleanText;
                } else {
                    document.getElementById('inputCode1').value = cleanText;
                }
                updateFromForm();
            }
        }

        function changeType(type) {
            currentType = type;
            const badgeEl = document.getElementById('typeBadge');
            const displayEl = document.getElementById('displayMode');

            // 隱藏所有配置與條碼容器
            document.getElementById('goodsConfig').classList.add('hidden');
            document.getElementById('utilityConfig').classList.add('hidden');
            document.getElementById('egtcConfig').classList.add('hidden');
            document.getElementById('singleBarcodeWrapper').classList.add('hidden');
            document.getElementById('utilityBarcodesWrapper').classList.add('hidden');
            document.getElementById('egtcBarcodesWrapper').classList.add('hidden');
            document.getElementById('barcodeValTextWrapper').classList.remove('hidden');

            if (type === 'goods') {
                badgeEl.innerText = '商品條碼';
                displayEl.innerText = '商品交易';
                document.getElementById('goodsConfig').classList.remove('hidden');
                document.getElementById('singleBarcodeWrapper').classList.remove('hidden');
                document.getElementById('formatLabel').innerText = currentBarcodeFormat;
            } else if (type === 'utility') {
                badgeEl.innerText = '繳費單';
                displayEl.innerText = '繳費單據';
                document.getElementById('utilityConfig').classList.remove('hidden');
                document.getElementById('utilityBarcodesWrapper').classList.remove('hidden');
                document.getElementById('barcodeValTextWrapper').classList.add('hidden');
                document.getElementById('formatLabel').innerText = 'CODE128 (三段)';
            } else if (type === 'egtc') {
                badgeEl.innerText = '電子兌換券';
                displayEl.innerText = '電子兌換券 (EGTC)';
                document.getElementById('egtcConfig').classList.remove('hidden');
                document.getElementById('egtcBarcodesWrapper').classList.remove('hidden');
                document.getElementById('formatLabel').innerText = 'CODE128 (雙條碼)';
            }

            updateFromForm();
        }

        function setBarcodeFormat(format) {
            currentBarcodeFormat = format;
            document.getElementById('selectBarcodeFormat').value = format;
            document.getElementById('formatLabel').innerText = format;
            renderBarcodes();
        }

        function fillSampleData() {
            if (currentType === 'goods') {
                document.getElementById('inputBarcode').value = currentBarcodeFormat === 'EAN13' ? "4710088411234" : "20719128";
            } else if (currentType === 'utility') {
                document.getElementById('inputCode1').value = "131201788";
                document.getElementById('inputCode2').value = "9524294830000049";
                document.getElementById('inputCode3').value = "";
            } else if (currentType === 'egtc') {
                document.getElementById('inputEgtcBarcode1').value = "7500088501181646";
                document.getElementById('inputEgtcBarcode2').value = "GKGE047D";
            }
            updateFromForm();
        }

        function renderBarcodes() {
            document.getElementById('barcodeErrorMsg').classList.add('hidden');

            if (currentType === 'goods') {
                const commodity = currentPayload?.Goods?.[0]?.Commodity?.[0] || {};
                let rawBarcodeVal = String(commodity.Barcode !== undefined ? commodity.Barcode : "20719128");

                let targetVal = rawBarcodeVal;
                // 自動補齊 EAN-8 / EAN-13 檢查碼邏輯
                if (currentBarcodeFormat === 'EAN8' && rawBarcodeVal.length === 7) {
                    let sum = 0;
                    for(let i=0; i<7; i++) sum += parseInt(rawBarcodeVal[i]) * (i % 2 === 0 ? 3 : 1);
                    targetVal = rawBarcodeVal + ((10 - (sum % 10)) % 10);
                } else if (currentBarcodeFormat === 'EAN13' && rawBarcodeVal.length === 12) {
                    let sum = 0;
                    for(let i=0; i<12; i++) sum += parseInt(rawBarcodeVal[i]) * (i % 2 === 1 ? 3 : 1);
                    targetVal = rawBarcodeVal + ((10 - (sum % 10)) % 10);
                }

                document.getElementById('barcodeValText').innerText = targetVal;
                try {
                    JsBarcode("#barcode1D", targetVal, { format: currentBarcodeFormat, lineColor: "#000000", width: 2, height: 65, displayValue: true, fontSize: 13, margin: 2 });
                    document.getElementById('barcode1D').style.display = "block";
                } catch (e) {
                    document.getElementById('barcode1D').style.display = "none";
                    document.getElementById('barcodeErrorMsg').classList.remove('hidden');
                }
            } else if (currentType === 'utility') {
                const ordinary = currentPayload?.Utility?.[0]?.Ordinary?.[0] || {};
                const c1 = ordinary.code1 || "";
                const c2 = ordinary.code2 || "";
                const c3 = ordinary.code3 || "";

                try {
                    if (c1) JsBarcode("#barcodeCode1", c1, { format: "CODE128", width: 1.8, height: 40, displayValue: true, fontSize: 11, margin: 2 });
                    if (c2) JsBarcode("#barcodeCode2", c2, { format: "CODE128", width: 1.5, height: 40, displayValue: true, fontSize: 11, margin: 2 });

                    if (c3) {
                        document.getElementById('wrapperCode3').classList.remove('hidden');
                        JsBarcode("#barcodeCode3", c3, { format: "CODE128", width: 1.8, height: 40, displayValue: true, fontSize: 11, margin: 2 });
                    } else {
                        document.getElementById('wrapperCode3').classList.add('hidden');
                    }
                } catch (e) {
                    document.getElementById('barcodeErrorMsg').classList.remove('hidden');
                }
            } else if (currentType === 'egtc') {
                const egtcData = currentPayload?.Payment?.[0]?.EGTC?.[0] || {};
                const b1 = egtcData.Barcode1 || "";
                const b2 = egtcData.Barcode2 || "";

                document.getElementById('barcodeValText').innerText = b1;

                try {
                    if (b1) JsBarcode("#barcodeEgtc1", b1, { format: "CODE128", width: 1.6, height: 45, displayValue: true, fontSize: 11, margin: 2 });
                    if (b2) JsBarcode("#barcodeEgtc2", b2, { format: "CODE128", width: 1.8, height: 45, displayValue: true, fontSize: 11, margin: 2 });
                } catch (e) {
                    document.getElementById('barcodeErrorMsg').classList.remove('hidden');
                }
            }

            const jsonStr = JSON.stringify(currentPayload);
            document.getElementById("qrcode2D").innerHTML = "";
            new QRCode(document.getElementById("qrcode2D"), { text: jsonStr, width: 150, height: 150, colorDark : "#000000", colorLight : "#ffffff" });
            document.getElementById("payloadPreview").innerText = jsonStr;
        }

        function syncFormFromPayload() {
            if (currentPayload.Payment && currentPayload.Payment[0]?.EGTC) {
                currentType = 'egtc';
                document.getElementById('selectType').value = 'egtc';
                const egtcData = currentPayload.Payment[0].EGTC[0] || {};
                document.getElementById('inputEgtcBarcode1').value = egtcData.Barcode1 || "";
                document.getElementById('inputEgtcBarcode2').value = egtcData.Barcode2 || "";
                changeType('egtc');
            } else if (currentPayload.Utility) {
                currentType = 'utility';
                document.getElementById('selectType').value = 'utility';
                const ordinary = currentPayload.Utility[0]?.Ordinary?.[0] || {};
                document.getElementById('inputCode1').value = ordinary.code1 || "";
                document.getElementById('inputCode2').value = ordinary.code2 || "";
                document.getElementById('inputCode3').value = ordinary.code3 || "";
                changeType('utility');
            } else {
                currentType = 'goods';
                document.getElementById('selectType').value = 'goods';
                const commodity = currentPayload?.Goods?.[0]?.Commodity?.[0] || {};
                document.getElementById('inputBarcode').value = commodity.Barcode !== undefined ? commodity.Barcode : "20719128";
                document.getElementById('inputQty').value = commodity.Quantity || 1;
                changeType('goods');
            }
        }

        function updateFromForm() {
            if (currentType === 'goods') {
                const bc = document.getElementById('inputBarcode').value;
                const qty = Number(document.getElementById('inputQty').value) || 1;
                currentPayload = {
                    "Goods": [
                        {
                            "Commodity": [
                                {
                                    "Device": "POS",
                                    "Barcode": isNaN(bc) || bc === "" ? bc : Number(bc),
                                    "Quantity": qty
                                }
                            ]
                        }
                    ]
                };
            } else if (currentType === 'utility') {
                const c1 = document.getElementById('inputCode1').value.trim();
                const c2 = document.getElementById('inputCode2').value.trim();
                const c3 = document.getElementById('inputCode3').value.trim();
                currentPayload = {
                    "Utility": [
                        {
                            "Ordinary": [
                                {
                                    "Device": "POS",
                                    "code1": c1,
                                    "code2": c2,
                                    "code3": c3
                                }
                            ]
                        }
                    ]
                };
            } else if (currentType === 'egtc') {
                const b1 = document.getElementById('inputEgtcBarcode1').value.trim();
                const b2 = document.getElementById('inputEgtcBarcode2').value.trim();
                currentPayload = {
                    "Payment": [
                        {
                            "EGTC": [
                                {
                                    "Device": "POS",
                                    "Barcode1": b1,
                                    "Barcode2": b2
                                }
                            ]
                        }
                    ]
                };
            }
            renderBarcodes();
        }

        function registerPWA() {
            const manifestData = {
                "name": "7-ELEVEN POS 條碼系統",
                "short_name": "711 POS",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#f1f5f9",
                "theme_color": "#0f172a",
                "icons": [
                    {
                        "src": "https://cdn-icons-png.flaticon.com/512/3081/3081559.png",
                        "sizes": "512x512",
                        "type": "image/png"
                    }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        }
    </script>
</body>
